{% extends "base.html" %}
{% block title %}Criar conta | BotTask{% endblock %}
{% block content %}
<main class="auth-wrap">
    <section class="auth-card">
        <h1>Comece sua jornada 🚀</h1>
        <p class="sub">Crie sua conta para guardar suas missões, XP e conquistas.</p>
        <form action="{{ url_for('cadastro') }}" method="POST" class="formulario">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="nome">Nome</label>
                <input id="nome" type="text" name="nome" placeholder="Como devemos chamar você?" maxlength="30" autocomplete="name" required>
            </div>
            <div>
                <label for="email">E-mail</label>
                <input id="email" type="email" name="email" placeholder="seu@email.com" maxlength="254" autocomplete="email" required>
            </div>
            <div>
                <label for="senha">Senha</label>
                <input id="senha" type="password" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" autocomplete="new-password" required>
            </div>
            <button type="submit">Criar minha conta</button>
        </form>
        <p class="auth-footer">Já tem uma conta? <a class="link" href="{{ url_for('login') }}">Fazer login</a></p>
    </section>
</main>
{% endblock %}
